# Non-dialogue load probes: synthetic dataset + MemMachine REST backend.
#
# Synthetic data supports add-load, search-load, and mixed. It does not expose
# dialogue turns, so it cannot run chat-replay. Basic add throughput example:
#   ltm100 run --config examples/synthetic.yaml \
#       --scenario add-load --users 20 --duration 30 --seed 0
# --seed controls corpus content and workload scheduling by default. Set the
# optional corpus_seed below to fix data while varying --seed for scheduling.
# Corpus seed 0 preserves the original corpus; user IDs stay stable.
#
# For search-load, pre-ingest the corpus before the measured run:
#   ltm100 run --config examples/synthetic.yaml \
#       --scenario search-load --users 20 --duration 30 --seed 0 \
#       --preingest --preingest-fraction 1.0
#
# For one controlled memory-growth point, raise memories_per_user to at least
# the requested size and keep the query pool fixed across points:
#   ltm100 run --config examples/synthetic.yaml \
#       --scenario search-load --users 1 --duration 30 --seed 0 \
#       --preingest --preingest-items-per-user 10000 --query-limit 1000
#
# Or sweep the default 100-memory corpus automatically:
#   ltm100 sweep memory-growth --config examples/synthetic.yaml \
#       --memory-counts 10,50,100 --queries-per-user 10 \
#       --users 4 --duration 30 --repetitions 3 \
#       --output out/memory-growth

dataset:
  name: synthetic
  memories_per_user: 100
  content_chars: 200  # Requested filler characters; excludes the user/index prefix.
  # corpus_seed: 42  # Omitted/null inherits --seed; 0 and negative integers are valid.
  # Optional: write metadata.category (cat_0..cat_{N-1}) so --filter can select
  # ~1/N of the data. Uncomment to use, e.g. `--filter metadata.category=cat_3`.
  # categories: 10

backend:
  name: memmachine
  base_url: http://localhost:8080
  org_prefix: ltm100
  timeout: 60.0
  add_batch_size: 50
  # Optional: retry connection-level failures only (HTTP errors are never
  # retried, so the error rate stays accurate). Default 0.
  # retries: 3
