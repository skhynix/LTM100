# Agent trajectory corpus + MemMachine REST backend.
# Use coding-agent for policy replay; add/search/mixed use the corpus view.
# Nebius does not expose chatbot turns and cannot run chat-replay.
#
# Install the dataset extra for Hugging Face or local Parquet:
#   pip install -e ".[datasets]"
#
# Agent replay (the profile is independent of backend transport):
#   ltm100 run --config examples/nebius.yaml --scenario coding-agent \
#       --agent-profile examples/agent-profile.yaml --users 10 \
#       --duration 300 --seed 0 --top-k 20
#
# Add workload:
#   ltm100 run --config examples/nebius.yaml \
#       --scenario add-load --users 10 --ops 100 --seed 0
# Search workload with a bounded pre-ingest/query prefix:
#   ltm100 run --config examples/nebius.yaml \
#       --scenario search-load --users 10 --ops 100 --seed 0 \
#       --preingest --preingest-items-per-user 20 --query-limit 20 --top-k 20

dataset:
  name: nebius
  # The source has 67,074 attempts, not 67,074 different issues/developers.
  # Select the first 100 source rows before seeded user assignment.
  # length limits selected/validated records, not the source download size.
  length: 100
  chunk_chars: 3000
  revision: 35455389ab51bf5e2306bfd436ef72d0f98bf882
  # path takes precedence over Hugging Face/revision. JSON/JSONL is also supported.
  # path: ~/datasets/nebius/trajectories.parquet
  # cache_dir: ~/datasets/cache

backend:
  name: memmachine
  base_url: http://localhost:8080
  org_prefix: ltm100
  timeout: 60.0
  add_batch_size: 50
